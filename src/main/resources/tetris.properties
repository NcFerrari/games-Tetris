# Vychozi nastaveni Tetrisu.
# Chces-li neco zmenit, vytvor soubor tetris.properties vedle Tetris.jar
# a uved v nem jen ty klice, ktere chces prepsat.

# Rozmery hraci desky v polickach
board.width=10
board.height=20

# Velikost jednoho policka v pixelech
field.size=40

# Rychlost padani: zacina na baseDelayMillis a za kazdy smazany radek
# se zkracuje o stepMillis, nejvyse vsak na minDelayMillis.
speed.baseDelayMillis=500
speed.minDelayMillis=100
speed.stepMillis=3

# Blikani mazanych radku: kolikrat probliknou a jak dlouho trva jedno bliknuti
blink.count=6
blink.durationMillis=90
